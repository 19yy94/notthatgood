<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>물풍선 대작전</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
:root{
  --bg:#fdf3e7; --ink:#3b2f2a; --sub:#8a7a70; --card:#fffaf3; --line:#ecd9c4;
  --p1:#ff8fb1; --p2:#5fd3bc; --accent:#3a9cf0;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Jua',system-ui,sans-serif;
  min-height:100vh;display:flex;justify-content:center;align-items:flex-start;padding:16px}
#app{width:min(720px,100%)}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:4px 0 12px}
h1{font-size:28px;margin:0;letter-spacing:-.5px}
h1 span{color:var(--accent)}
.score{display:flex;gap:8px;align-items:center}
.chip{display:flex;align-items:center;gap:8px;background:var(--card);border:2px solid var(--line);
  border-radius:999px;padding:6px 14px 6px 8px;font-size:18px}
.dot{width:18px;height:18px;border-radius:50%}
.chip b{font-size:22px;min-width:14px;text-align:center}
.target{color:var(--sub);font-size:14px}
#stage{position:relative;border-radius:18px;overflow:hidden;border:4px solid #6b5345;
  box-shadow:0 8px 0 #c9ad93;background:#b2db95}
canvas{display:block;width:100%;height:auto}
#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:rgba(59,47,42,.45);backdrop-filter:blur(2px);padding:16px}
#overlay.hide{display:none}
.panel{background:var(--card);border-radius:20px;padding:26px 24px;width:min(420px,100%);
  text-align:center;border:3px solid var(--line);box-shadow:0 6px 0 rgba(0,0,0,.12)}
.panel h2{margin:0 0 6px;font-size:26px}
.panel p{margin:6px 0 16px;color:var(--sub);font-size:16px;line-height:1.45}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:14px;font:inherit;font-size:20px;
  cursor:pointer;margin-top:10px;color:#fff;background:var(--accent);box-shadow:0 4px 0 #2474bd;transition:transform .05s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #2474bd}
.btn.alt{background:#fff;color:var(--ink);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.linkrow{display:flex;gap:8px}
.linkrow input{flex:1;min-width:0;font:inherit;font-size:14px;padding:12px;border-radius:12px;
  border:2px solid var(--line);background:#fff;color:var(--ink)}
.linkrow .btn{width:auto;margin:0;padding:0 18px;font-size:16px}
.wait{margin-top:14px;color:var(--sub);font-size:15px}
.wait::after{content:'';animation:dots 1.2s infinite}
@keyframes dots{0%{content:''}33%{content:'.'}66%{content:'..'}100%{content:'...'}}
.help{color:var(--sub);text-align:center;font-size:15px;margin:14px 0 0;line-height:1.6}
.hide{display:none!important}
@media (max-width:520px){h1{font-size:22px}.chip{font-size:15px}.target{display:none}}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>물풍선 <span>대작전</span></h1>
    <div class="score">
      <div class="chip"><div class="dot" style="background:var(--p1)"></div><span id="n0">P1</span><b id="s0">0</b></div>
      <div class="chip"><div class="dot" style="background:var(--p2)"></div><span id="n1">P2</span><b id="s1">0</b></div>
      <span class="target">3판 선승</span>
    </div>
  </header>

  <div id="stage">
    <canvas id="c"></canvas>
    <div id="overlay">
      <div class="panel" id="pMenu">
        <h2>물풍선 대작전</h2>
        <p>방을 만들고 링크를 친구에게 보내면<br>둘이서 바로 대결할 수 있어요.</p>
        <button class="btn" id="btnHost">방 만들기</button>
        <button class="btn alt" id="btnLocal">한 키보드로 2인 플레이</button>
      </div>
      <div class="panel hide" id="pHost">
        <h2>친구에게 링크 보내기</h2>
        <p>이 창을 열어둔 채로 기다려 주세요.</p>
        <div class="linkrow">
          <input id="link" readonly value="방 만드는 중…">
          <button class="btn" id="btnCopy">복사</button>
        </div>
        <div class="wait">친구 기다리는 중</div>
      </div>
      <div class="panel hide" id="pMsg">
        <h2 id="msgTitle">접속 중</h2>
        <p id="msgBody">친구 방에 들어가는 중이에요…</p>
        <button class="btn alt hide" id="btnHome">처음으로</button>
      </div>
    </div>
  </div>
  <p class="help" id="help">이동: 방향키 또는 WASD · 물풍선: 스페이스</p>
</div>

<script>
// ===== 기본 설정 =====
const W=15, H=13, T=48, HB=0.38, WIN=3;
const DIRS={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};
const COL=[{main:'#ff8fb1',dark:'#e0638c',light:'#ffd3e0'},{main:'#5fd3bc',dark:'#2fa890',light:'#c8f3ea'}];
const $=id=>document.getElementById(id);
const cv=$('c'), ctx=cv.getContext('2d');
const dpr=Math.min(2,window.devicePixelRatio||1);
cv.width=W*T*dpr; cv.height=H*T*dpr; ctx.scale(dpr,dpr);

const ROOM=new URLSearchParams(location.search).get('room');
let mode=null, me=-1, peer=null, conn=null;
let S=null;
const inputs=[{dirs:[],bomb:0},{dirs:[],bomb:0}];
const lastBomb=[0,0];
const disp=[{x:0.5,y:0.5},{x:W-0.5,y:H-0.5}];

// ===== 게임 상태 =====
function mkP(id,x,y){return{id,x,y,dir:'down',maxB:1,range:1,speed:3.4,state:'alive',trapT:0,deadT:0,moving:false}}
function safe(x,y){return (x+y<=2)||((W-1-x)+(H-1-y)<=2)}
function newMatch(){S={scores:[0,0],time:0};newRound()}
function newRound(){
  S.grid=[];S.hidden=[];
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    let v=0,h=0;
    if(x%2===1&&y%2===1)v=1;
    else if(!safe(x,y)&&Math.random()<0.72){
      v=2;
      if(Math.random()<0.45){const r=Math.random();h=r<0.4?'b':r<0.8?'r':'s'}
    }
    S.grid.push(v);S.hidden.push(h);
  }
  S.items=[];S.balloons=[];S.flames=[];
  S.players=[mkP(0,0.5,0.5),mkP(1,W-0.5,H-0.5)];
  S.phase='count';S.timer=3;S.result=null;S.playStart=-9;
}

// ===== 충돌 / 이동 =====
const idx=(x,y)=>y*W+x;
const balloonAt=(x,y)=>S.balloons.find(b=>b.x===x&&b.y===y);
function cellBlocked(cx,cy,p){
  if(cx<0||cy<0||cx>=W||cy>=H)return true;
  if(S.grid[idx(cx,cy)])return true;
  const b=balloonAt(cx,cy);
  return !!(b&&!b.pass.includes(p.id));
}
function hits(x,y,p){
  const x0=Math.floor(x-HB),x1=Math.floor(x+HB-1e-6),y0=Math.floor(y-HB),y1=Math.floor(y+HB-1e-6);
  for(let cy=y0;cy<=y1;cy++)for(let cx=x0;cx<=x1;cx++)if(cellBlocked(cx,cy,p))return true;
  return false;
}
function overlapCell(p,x,y){return Math.abs(p.x-(x+.5))<.5+HB&&Math.abs(p.y-(y+.5))<.5+HB}
function moveAxis(p,axis,s,dist){
  const o=axis==='x'?'y':'x';
  const n=p[axis]+s*dist;
  if(!hits(axis==='x'?n:p.x,axis==='x'?p.y:n,p)){p[axis]=n;return}
  // 벽에 붙이기
  const c=s>0?Math.ceil(p[axis]+HB)-HB-1e-4:Math.floor(p[axis]-HB)+HB+1e-4;
  if((c-p[axis])*s>0&&!hits(axis==='x'?c:p.x,axis==='x'?p.y:c,p))p[axis]=c;
  // 모서리 미끄러지기
  const lane=Math.floor(p[o]),center=lane+.5;
  const front=Math.floor(p[axis]+s*(HB+.02));
  const free=axis==='x'?!cellBlocked(front,lane,p):!cellBlocked(lane,front,p);
  if(Math.abs(p[o]-center)>.01&&free){
    const step=Math.min(dist,Math.abs(center-p[o]));
    const v=p[o]+Math.sign(center-p[o])*step;
    if(!hits(axis==='x'?p.x:v,axis==='x'?v:p.y,p))p[o]=v;
  }
}
function move(p,dir,dist){const[dx,dy]=DIRS[dir];if(dx)moveAxis(p,'x',dx,dist);else moveAxis(p,'y',dy,dist)}

// ===== 물풍선 / 물줄기 =====
function placeBalloon(p){
  const x=Math.floor(p.x),y=Math.floor(p.y);
  if(S.balloons.filter(b=>b.owner===p.id).length>=p.maxB)return;
  if(balloonAt(x,y)||S.grid[idx(x,y)])return;
  S.balloons.push({x,y,t:2.6,range:p.range,owner:p.id,pass:S.players.filter(q=>q.state!=='dead'&&overlapCell(q,x,y)).map(q=>q.id)});
}
function addFlame(x,y,k){
  const f=S.flames.find(f=>f.x===x&&f.y===y);
  if(f){f.t=.5;if(f.k!==k)f.k='c'}else S.flames.push({x,y,k,t:.5});
}
function explode(b){
  S.balloons.splice(S.balloons.indexOf(b),1);
  addFlame(b.x,b.y,'c');
  for(const d in DIRS){
    const[dx,dy]=DIRS[d],k=dx?'h':'v';
    for(let i=1;i<=b.range;i++){
      const x=b.x+dx*i,y=b.y+dy*i;
      if(x<0||y<0||x>=W||y>=H||S.grid[idx(x,y)]===1)break;
      if(S.grid[idx(x,y)]===2){
        S.grid[idx(x,y)]=0;addFlame(x,y,k);
        const h=S.hidden[idx(x,y)];
        if(h){S.items.push({x,y,k:h,d:.5});S.hidden[idx(x,y)]=0}
        break;
      }
      const ob=balloonAt(x,y);
      if(ob){ob.t=0;addFlame(x,y,k);break}
      S.items=S.items.filter(it=>!(it.x===x&&it.y===y&&it.d<=0));
      addFlame(x,y,k);
    }
  }
}
const flameAt=(x,y)=>S.flames.some(f=>f.x===x&&f.y===y);
function kill(p){p.state='dead';p.deadT=0}

// ===== 업데이트 (방장/로컬에서만 실행) =====
function tickFx(dt){
  S.flames.forEach(f=>f.t-=dt);S.flames=S.flames.filter(f=>f.t>0);
  S.items.forEach(it=>{if(it.d>0)it.d-=dt});
  S.players.forEach(p=>{if(p.state==='dead')p.deadT+=dt});
}
function update(dt){
  S.time+=dt;
  const press=[0,1].map(i=>{const n=inputs[i].bomb>lastBomb[i];lastBomb[i]=inputs[i].bomb;return n});
  if(S.phase==='wait')return;
  if(S.phase==='count'){S.timer-=dt;if(S.timer<=0){S.phase='play';S.playStart=S.time}return}
  if(S.phase==='end'){S.timer-=dt;tickFx(dt);if(S.timer<=0)newRound();return}
  if(S.phase==='over'){S.timer-=dt;tickFx(dt);if(S.timer<=0&&(press[0]||press[1]))newMatch();return}

  S.players.forEach((p,i)=>{
    p.moving=false;
    if(p.state==='dead')return;
    const d=inputs[i].dirs[inputs[i].dirs.length-1];
    if(d){
      p.dir=d;const ox=p.x,oy=p.y;
      move(p,d,(p.state==='trapped'?0.7:p.speed)*dt);
      p.moving=p.x!==ox||p.y!==oy;
    }
    if(p.state==='alive'&&press[i])placeBalloon(p);
  });
  S.balloons.forEach(b=>{b.pass=b.pass.filter(id=>overlapCell(S.players[id],b.x,b.y));b.t-=dt});
  for(let g=0;g<200;g++){const b=S.balloons.find(b=>b.t<=0);if(!b)break;explode(b)}
  tickFx(dt);

  S.players.forEach(p=>{
    if(p.state==='alive'&&flameAt(Math.floor(p.x),Math.floor(p.y))){p.state='trapped';p.trapT=3.2}
    else if(p.state==='trapped'){p.trapT-=dt;if(p.trapT<=0)kill(p)}
  });
  const[a,b]=S.players;
  if(Math.hypot(a.x-b.x,a.y-b.y)<0.8){
    if(a.state==='alive'&&b.state==='trapped')kill(b);
    else if(b.state==='alive'&&a.state==='trapped')kill(a);
  }
  S.players.forEach(p=>{
    if(p.state!=='alive')return;
    const fx=Math.floor(p.x),fy=Math.floor(p.y);
    const it=S.items.find(it=>it.d<=0&&it.x===fx&&it.y===fy);
    if(!it)return;
    if(it.k==='b')p.maxB=Math.min(8,p.maxB+1);
    if(it.k==='r')p.range=Math.min(8,p.range+1);
    if(it.k==='s')p.speed=Math.min(6,p.speed+.5);
    S.items.splice(S.items.indexOf(it),1);
  });
  const dead=S.players.filter(p=>p.state==='dead');
  if(dead.length){
    if(dead.length===2)S.result=-1;
    else{S.result=dead[0].id===0?1:0;S.scores[S.result]++}
    if(S.result>=0&&S.scores[S.result]>=WIN){S.phase='over';S.timer=1.5}
    else{S.phase='end';S.timer=2.6}
  }
}

// ===== 그리기 =====
function rr(x,y,w,h,r,fill){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fillStyle=fill;ctx.fill()}
function circle(x,y,r,fill){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=fill;ctx.fill()}
function ellipse(x,y,rx,ry,fill){ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fillStyle=fill;ctx.fill()}
const nameOf=i=>mode==='local'||me<0?`P${i+1}`:(i===me?'나':'친구');

function drawGround(){
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    ctx.fillStyle=(x+y)%2?'#b2db95':'#bfe3a4';ctx.fillRect(x*T,y*T,T,T);
  }
}
function drawWall(x,y){
  const px=x*T,py=y*T;
  rr(px+2,py+5,T-4,T-6,9,'#6f7e95');
  rr(px+2,py+2,T-4,T-12,9,'#a3b0c4');
  rr(px+8,py+7,14,5,3,'rgba(255,255,255,.45)');
}
function drawBox(x,y){
  const px=x*T,py=y*T;
  rr(px+3,py+6,T-6,T-8,7,'#a8692f');
  rr(px+3,py+3,T-6,T-13,7,'#e0a565');
  ctx.fillStyle='#c98b4c';ctx.fillRect(px+5,py+15,T-10,3);ctx.fillRect(px+5,py+26,T-10,3);
  circle(px+9,py+9,2,'#8a5526');circle(px+T-9,py+9,2,'#8a5526');
}
function drawItem(it){
  if(it.d>0)return;
  const cx=(it.x+.5)*T,cy=(it.y+.5)*T+Math.sin(S.time*4+it.x)*2;
  ellipse(cx,(it.y+.5)*T+14,11,4,'rgba(0,0,0,.15)');
  circle(cx,cy,15,'rgba(255,255,255,.85)');
  ctx.lineWidth=2;ctx.strokeStyle='#fff';ctx.stroke();
  if(it.k==='b'){circle(cx,cy+1,8,'#3a9cf0');circle(cx-3,cy-2,2.5,'rgba(255,255,255,.8)');rr(cx-2,cy-10,4,4,1,'#2474bd')}
  if(it.k==='r'){rr(cx-3,cy-10,6,7,2,'#c9a27a');circle(cx,cy+3,7.5,'#a46bff');circle(cx-3,cy+1,2,'rgba(255,255,255,.7)')}
  if(it.k==='s'){
    ctx.beginPath();ctx.moveTo(cx-9,cy+3);ctx.lineTo(cx-9,cy-7);ctx.lineTo(cx-2,cy-7);ctx.lineTo(cx,cy-2);
    ctx.quadraticCurveTo(cx+9,cy-1,cx+9,cy+3);ctx.closePath();ctx.fillStyle='#ffc94a';ctx.fill();
    ctx.fillStyle='#e08a1e';ctx.fillRect(cx-9,cy+3,18,2.5);
    circle(cx-5,cy+8,2.5,'#5b4a40');circle(cx+5,cy+8,2.5,'#5b4a40');
  }
}
function drawBalloon(b){
  const cx=(b.x+.5)*T,cy=(b.y+.5)*T;
  const sp=b.t<.8?24:9;
  const s=1+.07*Math.sin(S.time*sp+b.x);
  ellipse(cx,cy+15,13,4,'rgba(0,0,0,.18)');
  const g=ctx.createRadialGradient(cx-5,cy-6,2,cx,cy,18);
  g.addColorStop(0,'#a8dcff');g.addColorStop(1,b.t<.8&&Math.sin(S.time*30)>0?'#5c7cf0':'#2f8fe8');
  ctx.beginPath();ctx.ellipse(cx,cy+1,16*s,15*s,0,0,Math.PI*2);ctx.fillStyle=g;ctx.fill();
  ellipse(cx-6,cy-5,4,6,'rgba(255,255,255,.75)');
  ctx.beginPath();ctx.moveTo(cx-4,cy-15*s);ctx.lineTo(cx+4,cy-15*s);ctx.lineTo(cx,cy-11*s);ctx.closePath();
  ctx.fillStyle=COL[b.owner].dark;ctx.fill();
}
function drawFlame(f){
  const px=f.x*T,py=f.y*T,cx=px+T/2,cy=py+T/2;
  ctx.globalAlpha=Math.min(1,f.t/.15);
  const w=Math.sin(S.time*30+f.x+f.y)*1.5;
  if(f.k==='h'){rr(px-2,cy-14+w/2,T+4,28-w,14,'#8fdcff');rr(px-2,cy-6,T+4,12,6,'#fff')}
  else if(f.k==='v'){rr(cx-14+w/2,py-2,28-w,T+4,14,'#8fdcff');rr(cx-6,py-2,12,T+4,6,'#fff')}
  else{circle(cx,cy,21+w,'#8fdcff');circle(cx,cy,11,'#fff')}
  ctx.globalAlpha=1;
}
function drawPlayer(i){
  const p=S.players[i],c=COL[i];
  const x=disp[i].x*T,y=disp[i].y*T;
  if(p.state==='dead'){
    if(p.deadT<.5){
      const r=20+p.deadT*60;ctx.globalAlpha=1-p.deadT*2;
      ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.lineWidth=4;ctx.strokeStyle='#fff';ctx.stroke();
      ctx.globalAlpha=1;
    }
    return;
  }
  const bob=p.moving?Math.sin(S.time*16)*2:0;
  const trapped=p.state==='trapped';
  const lift=trapped?-6+Math.sin(S.time*4)*2:0;
  ellipse(x,y+16,14,5,'rgba(0,0,0,.18)');
  const by=y-3+lift;
  // 발
  const fs=p.moving?Math.sin(S.time*16)*3:0;
  ellipse(x-7,by+16+fs,6,4,c.dark);ellipse(x+7,by+16-fs,6,4,c.dark);
  // 몸
  circle(x,by+bob,17,c.main);
  ellipse(x,by+7+bob,10,7,c.light);
  // 머리 장식
  if(i===0){
    ctx.fillStyle='#ff4f86';
    ctx.beginPath();ctx.moveTo(x,by-15+bob);ctx.lineTo(x-9,by-22+bob);ctx.lineTo(x-9,by-11+bob);ctx.fill();
    ctx.beginPath();ctx.moveTo(x,by-15+bob);ctx.lineTo(x+9,by-22+bob);ctx.lineTo(x+9,by-11+bob);ctx.fill();
    circle(x,by-16+bob,3,'#ff4f86');
  }else{
    ctx.strokeStyle='#3bb36b';ctx.lineWidth=2.5;
    ctx.beginPath();ctx.moveTo(x,by-16+bob);ctx.quadraticCurveTo(x+1,by-22+bob,x+4,by-25+bob);ctx.stroke();
    ctx.save();ctx.translate(x+7,by-26+bob);ctx.rotate(-.5);ellipse(0,0,6,3.5,'#5ccf7f');ctx.restore();
  }
  // 얼굴
  if(p.dir!=='up'){
    const ex=p.dir==='left'?-4:p.dir==='right'?4:0,ey=p.dir==='down'?1:0;
    const blink=Math.sin(S.time*2.3+i*2)>.97;
    [-6,6].forEach(o=>{
      if(trapped){ctx.strokeStyle='#3b2f2a';ctx.lineWidth=2;ctx.beginPath();
        ctx.moveTo(x+o+ex-3,by-6+ey+bob-2);ctx.lineTo(x+o+ex+3,by-6+ey+bob+2);
        ctx.moveTo(x+o+ex+3,by-6+ey+bob-2);ctx.lineTo(x+o+ex-3,by-6+ey+bob+2);ctx.stroke();return}
      if(blink){rr(x+o+ex-4,by-6+ey+bob,8,2,1,'#3b2f2a');return}
      circle(x+o+ex,by-5+ey+bob,4.5,'#fff');circle(x+o+ex*1.3,by-5+ey+bob,2.6,'#3b2f2a');
    });
    ellipse(x-11+ex,by+2+bob,3.5,2.2,'rgba(255,90,120,.35)');
    ellipse(x+11+ex,by+2+bob,3.5,2.2,'rgba(255,90,120,.35)');
  }
  if(trapped){
    const r=26+Math.sin(S.time*6)*1.5;
    ctx.beginPath();ctx.arc(x,by+2,r,0,Math.PI*2);ctx.fillStyle='rgba(170,225,255,.38)';ctx.fill();
    ctx.lineWidth=2;ctx.strokeStyle='rgba(255,255,255,.9)';ctx.stroke();
    ctx.beginPath();ctx.arc(x-8,by-8,7,Math.PI*1.1,Math.PI*1.6);ctx.lineWidth=3;ctx.stroke();
    ctx.beginPath();ctx.arc(x,by+2,r+4,-Math.PI/2,-Math.PI/2+Math.PI*2*(p.trapT/3.2));
    ctx.strokeStyle='rgba(255,90,120,.8)';ctx.lineWidth=3;ctx.stroke();
  }
  // 이름표
  if(mode!=='local'&&i===me){
    ctx.font='14px Jua';ctx.textAlign='center';
    const ty=by-34+lift;
    rr(x-14,ty-11,28,18,9,'rgba(59,47,42,.75)');
    ctx.fillStyle='#fff';ctx.fillText('나',x,ty+3);
  }
}
function banner(text,sub){
  ctx.fillStyle='rgba(59,47,42,.55)';ctx.fillRect(0,H*T/2-60,W*T,sub?120:100);
  ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='54px Jua';
  ctx.fillText(text,W*T/2,H*T/2+(sub?4:18));
  if(sub){ctx.font='20px Jua';ctx.fillStyle='#ffe9c7';ctx.fillText(sub,W*T/2,H*T/2+42)}
}
function render(){
  drawGround();
  S.items.forEach(drawItem);
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const g=S.grid[idx(x,y)];if(g===1)drawWall(x,y);else if(g===2)drawBox(x,y);
  }
  S.balloons.forEach(drawBalloon);
  S.flames.forEach(drawFlame);
  [0,1].sort((a,b)=>disp[a].y-disp[b].y).forEach(drawPlayer);

  if(S.phase==='count')banner(String(Math.ceil(S.timer)));
  else if(S.phase==='play'&&S.time-S.playStart<.7)banner('시작!');
  else if(S.phase==='end')banner(S.result<0?'무승부!':`${nameOf(S.result)} 승리!`);
  else if(S.phase==='over')banner(`${nameOf(S.result)} 최종 우승!`,S.timer<=0?'스페이스를 누르면 다시 시작해요':' ');

  $('s0').textContent=S.scores[0];$('s1').textContent=S.scores[1];
  $('n0').textContent=nameOf(0);$('n1').textContent=nameOf(1);
}

// ===== 입력 =====
const KEY_ONLINE={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',KeyW:'up',KeyS:'down',KeyA:'left',KeyD:'right',Space:'bomb',Enter:'bomb',ShiftLeft:'bomb',ShiftRight:'bomb'};
const KEY_LOCAL={KeyW:[0,'up'],KeyS:[0,'down'],KeyA:[0,'left'],KeyD:[0,'right'],Space:[0,'bomb'],KeyF:[0,'bomb'],
  ArrowUp:[1,'up'],ArrowDown:[1,'down'],ArrowLeft:[1,'left'],ArrowRight:[1,'right'],Enter:[1,'bomb'],Slash:[1,'bomb'],ShiftRight:[1,'bomb']};
function keyTarget(code){
  if(mode==='local')return KEY_LOCAL[code]||null;
  if(me<0)return null;
  const a=KEY_ONLINE[code];return a?[me,a]:null;
}
function sendInput(){if(mode==='guest'&&conn&&conn.open)conn.send({t:'in',dirs:inputs[1].dirs,b:inputs[1].bomb})}
addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT')return;
  const t=keyTarget(e.code);if(!t)return;
  e.preventDefault();
  const[pi,a]=t,inp=inputs[pi];
  if(a==='bomb'){if(!e.repeat)inp.bomb++}
  else{const i=inp.dirs.indexOf(a);if(i>=0)inp.dirs.splice(i,1);inp.dirs.push(a)}
  sendInput();
});
addEventListener('keyup',e=>{
  const t=keyTarget(e.code);if(!t)return;
  const[pi,a]=t;if(a==='bomb')return;
  const inp=inputs[pi],i=inp.dirs.indexOf(a);if(i>=0)inp.dirs.splice(i,1);
  sendInput();
});
addEventListener('blur',()=>{inputs.forEach(i=>i.dirs=[]);sendInput()});

// ===== 화면 패널 =====
function show(id){$('overlay').classList.remove('hide');['pMenu','pHost','pMsg'].forEach(p=>$(p).classList.toggle('hide',p!==id))}
function hideOverlay(){$('overlay').classList.add('hide')}
function msg(title,body,home){$('msgTitle').textContent=title;$('msgBody').textContent=body;$('btnHome').classList.toggle('hide',!home);show('pMsg')}
$('btnHome').onclick=()=>{location.href=location.pathname};

// ===== 네트워크 =====
function rid(){return 'wb-'+Math.random().toString(36).slice(2,8)}
function startHost(){
  mode='host';me=0;
  $('help').textContent='이동: 방향키 또는 WASD · 물풍선: 스페이스';
  show('pHost');
  peer=new Peer(rid());
  peer.on('open',id=>{$('link').value=location.origin+location.pathname+'?room='+id});
  peer.on('connection',c=>{
    if(conn&&conn.open){c.close();return}
    conn=c;
    c.on('open',()=>{hideOverlay();newMatch()});
    c.on('data',d=>{if(d&&d.t==='in'){inputs[1].dirs=d.dirs||[];inputs[1].bomb=d.b||0}});
    c.on('close',()=>{conn=null;msg('친구가 나갔어요','새 방을 만들어서 다시 초대해 주세요.',true)});
  });
  peer.on('error',e=>{
    if(e.type==='unavailable-id'){peer.destroy();startHost();return}
    msg('연결 오류','방을 만들지 못했어요. 새로고침 후 다시 시도해 주세요. ('+e.type+')',true);
  });
}
function startGuest(){
  mode='guest';me=1;
  $('help').textContent='이동: 방향키 또는 WASD · 물풍선: 스페이스';
  msg('접속 중','친구 방에 들어가는 중이에요…',false);
  peer=new Peer();
  const timeout=setTimeout(()=>{if(!conn||!conn.open)msg('연결이 오래 걸려요','친구가 방 창을 열어두고 있는지 확인해 주세요. 회사·학교 와이파이에선 연결이 막힐 수 있어요.',true)},12000);
  peer.on('open',()=>{
    conn=peer.connect(ROOM,{reliable:true,serialization:'json'});
    conn.on('open',()=>{clearTimeout(timeout);hideOverlay()});
    conn.on('data',d=>{if(d&&d.t==='s')S=d.s});
    conn.on('close',()=>msg('연결이 끊겼어요','방장이 창을 닫았거나 인터넷이 끊겼어요.',true));
  });
  peer.on('error',e=>{
    clearTimeout(timeout);
    if(e.type==='peer-unavailable')msg('방을 찾을 수 없어요','친구가 창을 닫았거나 링크가 잘못됐어요. 새 링크를 받아 주세요.',true);
    else msg('연결 오류','접속하지 못했어요. ('+e.type+')',true);
  });
}
function startLocal(){
  mode='local';me=-1;
  $('help').innerHTML='P1(분홍): WASD 이동 · 스페이스 물풍선 &nbsp;|&nbsp; P2(민트): 방향키 이동 · 엔터 물풍선';
  hideOverlay();newMatch();
}
$('btnHost').onclick=startHost;
$('btnLocal').onclick=startLocal;
$('btnCopy').onclick=()=>{
  const v=$('link').value;if(!v.startsWith('http'))return;
  (navigator.clipboard?navigator.clipboard.writeText(v):Promise.reject()).then(
    ()=>{$('btnCopy').textContent='복사됨!';setTimeout(()=>$('btnCopy').textContent='복사',1500)},
    ()=>{$('link').select();document.execCommand('copy')});
};

// ===== 루프 =====
newMatch();S.phase='wait';
if(ROOM)startGuest();
let last=performance.now(),sendAcc=0;
function loop(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(mode==='host'||mode==='local'){
    update(dt);
    if(mode==='host'&&conn&&conn.open){
      sendAcc+=dt;
      if(sendAcc>=1/30){sendAcc=0;const{hidden,...pub}=S;conn.send({t:'s',s:pub})}
    }
  }else if(mode==='guest')S.time+=dt;
  S.players.forEach((p,i)=>{
    const d=disp[i];
    if(mode==='guest'&&Math.hypot(p.x-d.x,p.y-d.y)<2){const k=Math.min(1,dt*18);d.x+=(p.x-d.x)*k;d.y+=(p.y-d.y)*k}
    else{d.x=p.x;d.y=p.y}
  });
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
