<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>물풍선 대작전</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
:root{--bg:#eaf4fb;--ink:#2f2a33;--sub:#7d7a88;--card:#fff;--line:#cfe2ef;--accent:#2f8fe8}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 50% 0,#ffffff 0,var(--bg) 60%);color:var(--ink);
  font-family:'Jua',system-ui,sans-serif;min-height:100vh;display:flex;justify-content:center;align-items:flex-start;padding:16px}
#app{width:min(720px,100%)}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 0 12px;flex-wrap:wrap}
h1{font-size:28px;margin:0;letter-spacing:-.5px}
h1 span{color:var(--accent)}
.score{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:7px;background:var(--card);border:2px solid var(--line);
  border-radius:999px;padding:5px 12px 5px 7px;font-size:17px;box-shadow:0 3px 0 var(--line)}
.dot{width:18px;height:18px;border-radius:50%;box-shadow:inset -3px -3px 0 rgba(0,0,0,.15)}
.chip b{font-size:21px;min-width:14px;text-align:center}
.inv{font-size:13px;color:var(--sub)}
#btnMute{cursor:pointer;font:inherit;padding:5px 10px}
#stage{position:relative;border-radius:20px;overflow:hidden;border:5px solid #2f6f9c;
  box-shadow:0 9px 0 #9cc9e4,0 18px 30px rgba(30,60,90,.18);background:#cdeefb;transition:border-color .4s,box-shadow .4s}
canvas{display:block;width:100%;height:auto}
#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:rgba(30,40,60,.45);backdrop-filter:blur(3px);padding:16px}
#overlay.hide{display:none}
.panel{background:var(--card);border-radius:22px;padding:26px 24px;width:min(420px,100%);
  text-align:center;border:3px solid var(--line);box-shadow:0 7px 0 rgba(0,0,0,.12)}
.panel h2{margin:0 0 6px;font-size:26px}
.panel p{margin:6px 0 16px;color:var(--sub);font-size:16px;line-height:1.45}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:14px;font:inherit;font-size:20px;
  cursor:pointer;margin-top:10px;color:#fff;background:var(--accent);box-shadow:0 4px 0 #1f64ad;transition:transform .05s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #1f64ad}
.btn.alt{background:#fff;color:var(--ink);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.linkrow{display:flex;gap:8px}
.linkrow input{flex:1;min-width:0;font:inherit;font-size:14px;padding:12px;border-radius:12px;
  border:2px solid var(--line);background:#fff;color:var(--ink)}
.linkrow .btn{width:auto;margin:0;padding:0 18px;font-size:16px}
.wait{margin-top:14px;color:var(--sub);font-size:15px}
.wait::after{content:'';animation:dots 1.2s infinite}
@keyframes dots{0%{content:''}33%{content:'.'}66%{content:'..'}100%{content:'...'}}
.help{color:var(--sub);text-align:center;font-size:15px;margin:14px 0 0;line-height:1.7}
.help kbd{font-family:inherit;background:#fff;border:2px solid var(--line);border-bottom-width:3px;border-radius:7px;padding:0 6px;color:var(--ink)}
.hide{display:none!important}
@media (max-width:520px){h1{font-size:22px}.chip{font-size:14px}}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>물풍선 <span>대작전</span></h1>
    <div class="score">
      <div class="chip"><div class="dot" style="background:#ffa9c4"></div><span id="n0">P1</span><b id="s0">0</b><span class="inv" id="v0"></span></div>
      <div class="chip"><div class="dot" style="background:#86d67f"></div><span id="n1">P2</span><b id="s1">0</b><span class="inv" id="v1"></span></div>
      <button class="chip" id="btnMute" title="소리 켜기/끄기 (M)">🔊</button>
    </div>
  </header>

  <div id="stage">
    <canvas id="c"></canvas>
    <div id="overlay">
      <div class="panel" id="pMenu">
        <h2>물풍선 대작전</h2>
        <p>방을 만들고 링크를 친구에게 보내면<br>둘이서 바로 대결할 수 있어요. (3판 선승)</p>
        <button class="btn" id="btnHost">방 만들기</button>
        <button class="btn alt" id="btnLocal">한 키보드로 2인 테스트</button>
      </div>
      <div class="panel hide" id="pHost">
        <h2>친구에게 링크 보내기</h2>
        <p>이 창을 열어둔 채로 기다려 주세요.</p>
        <div class="linkrow">
          <input id="link" readonly value="방 만드는 중…">
          <button class="btn" id="btnCopy">복사</button>
        </div>
        <div class="wait">친구 기다리는 중</div>
      </div>
      <div class="panel hide" id="pMsg">
        <h2 id="msgTitle">접속 중</h2>
        <p id="msgBody">친구 방에 들어가는 중이에요…</p>
        <button class="btn alt hide" id="btnHome">처음으로</button>
      </div>
    </div>
  </div>
  <p class="help" id="help">이동 <kbd>방향키</kbd> / <kbd>WASD</kbd> · 물풍선 <kbd>Space</kbd> · 아이템 <kbd>Shift</kbd> / <kbd>Q</kbd></p>
  <p class="help" style="margin-top:4px">🪡 바늘: 물방울에 갇혔을 때 아이템 키로 탈출 · 👻 유령: 6초 동안 상대 화면에서 사라짐</p>
</div>

<script>
// ================= 기본 설정 =================
const W=15,H=13,T=48,HB=0.38,WIN=3;
const DIRS={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};
const COL=[
  {main:'#ffa9c4',light:'#ffe3ec',dark:'#e0709a',line:'#a8456a',hair:'#7a4a32',shoe:'#c94f76'},
  {main:'#86d67f',light:'#dff8d6',dark:'#49a552',line:'#2c6e34',hair:'#3a2a22',shoe:'#3a8a45'}];
const THEMES={
  snow:{name:'눈꽃마을',border:'#2f6f9c',shadow:'#9cc9e4'},
  candy:{name:'캔디마을',border:'#a0526d',shadow:'#eab9ca'},
  forest:{name:'숲속마을',border:'#4f7a34',shadow:'#b7d59e'}};
const LAYOUTS={classic:'바둑판',sparse:'광장',cross:'십자로',maze:'미로',ring:'성벽'};
const $=id=>document.getElementById(id);
const cv=$('c'),ctx=cv.getContext('2d');
const dpr=Math.min(2,window.devicePixelRatio||1);
cv.width=W*T*dpr;cv.height=H*T*dpr;ctx.scale(dpr,dpr);

const ROOM=new URLSearchParams(location.search).get('room');
let mode=null,me=-1,peer=null,conn=null,S=null;
const inputs=[{dirs:[],bomb:0,use:0},{dirs:[],bomb:0,use:0}];
const lastBomb=[0,0],lastUse=[0,0];
const disp=[{x:.5,y:.5},{x:W-.5,y:H-.5}];

// ================= 효과음 =================
let AC=null,muted=false,evCounter=0,lastEv=0;
function unlockAudio(){
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}
  if(AC&&AC.state==='suspended')AC.resume();
}
function tone(f,dur,type='sine',vol=.25,to=null,delay=0){
  if(!AC||muted)return;
  const t=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);
  if(to)o.frequency.exponentialRampToValueAtTime(to,t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(g).connect(AC.destination);o.start(t);o.stop(t+dur+.02);
}
function noise(dur,vol=.3,f1=1200,f2=300,delay=0){
  if(!AC||muted)return;
  const t=AC.currentTime+delay,len=Math.floor(AC.sampleRate*dur);
  const buf=AC.createBuffer(1,len,AC.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
  const src=AC.createBufferSource();src.buffer=buf;
  const bp=AC.createBiquadFilter();bp.type='bandpass';bp.Q.value=1.2;
  bp.frequency.setValueAtTime(f1,t);bp.frequency.exponentialRampToValueAtTime(f2,t+dur);
  const g=AC.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
  src.connect(bp).connect(g).connect(AC.destination);src.start(t);src.stop(t+dur);
}
const SFX={
  place(){tone(520,.13,'sine',.3,240)},
  boom(){noise(.4,.45,1400,250);tone(200,.28,'triangle',.3,55)},
  trap(){tone(380,.35,'sine',.22,720);tone(720,.3,'sine',.12,480,.12)},
  pop(){tone(950,.14,'square',.12,140);noise(.12,.3,3000,800)},
  item(){[660,880,1320].forEach((f,i)=>tone(f,.12,'triangle',.2,null,i*.07))},
  needle(){tone(1400,.08,'square',.1,2600);noise(.2,.35,4000,1500,.05);[880,1175,1568].forEach((f,i)=>tone(f,.12,'triangle',.18,null,.1+i*.06))},
  ghost(){tone(620,.5,'sine',.18,180);tone(640,.5,'sine',.1,190,.04);noise(.4,.12,900,300)},
  unghost(){tone(220,.25,'sine',.15,520)},
  beep(){tone(620,.12,'square',.1)},
  go(){tone(940,.3,'square',.12)},
  win(){[523,659,784,1047].forEach((f,i)=>tone(f,.18,'triangle',.22,null,i*.11))},
  draw(){tone(420,.2,'triangle',.2);tone(320,.3,'triangle',.2,null,.18)}
};
function emit(n){S.ev.push({i:++evCounter,n});if(S.ev.length>40)S.ev.shift()}
function playEvents(){if(!S.ev)return;for(const e of S.ev)if(e.i>lastEv){lastEv=e.i;SFX[e.n]&&SFX[e.n]()}}

// ================= 맵 생성 =================
const idx=(x,y)=>y*W+x;
const pick=a=>a[Math.floor(Math.random()*a.length)];
function safe(x,y){return (x+y<=2)||((W-1-x)+(H-1-y)<=2)}
function makeLayout(name){
  const s=new Array(W*H).fill(0);
  const set=(x,y)=>{s[idx(x,y)]=1;s[idx(W-1-x,H-1-y)]=1};
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const odd=x%2===1&&y%2===1;let on=false;
    if(name==='classic')on=odd;
    else if(name==='sparse')on=odd&&(x+y)%4===2;
    else if(name==='cross')on=(x===7&&y>=1&&y<=11&&y!==4&&y!==8)||(y===6&&x>=1&&x<=13&&x!==4&&x!==10)||(odd&&(x+y)%4===2&&Math.abs(x-7)>1&&Math.abs(y-6)>1);
    else if(name==='ring'){
      const onR=(x>=3&&x<=11&&(y===2||y===10))||(y>=2&&y<=10&&(x===3||x===11));
      on=(onR&&x!==7&&y!==6)||(odd&&(x<3||x>11||y<2||y>10))||(x===7&&y===6);
    }
    else if(name==='maze')on=odd?Math.random()<.4:((x%2)!==(y%2)&&x>0&&y>0&&x<W-1&&y<H-1&&Math.random()<.07);
    if(on)set(x,y);
  }
  for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(safe(x,y))s[idx(x,y)]=0;
  return s;
}
function connected(s){
  const seen=new Array(W*H).fill(0),q=[[0,0]];seen[0]=1;let n=1;
  while(q.length){const[x,y]=q.pop();for(const d in DIRS){const nx=x+DIRS[d][0],ny=y+DIRS[d][1];
    if(nx<0||ny<0||nx>=W||ny>=H||seen[idx(nx,ny)]||s[idx(nx,ny)])continue;seen[idx(nx,ny)]=1;n++;q.push([nx,ny])}}
  return n===s.filter(v=>!v).length;
}
function rollItem(){
  if(Math.random()>=.6)return 0;
  const r=Math.random();
  return r<.28?'b':r<.56?'r':r<.72?'s':r<.77?'m':r<.89?'n':'g';
}

// ================= 게임 상태 =================
function mkP(id,x,y){return{id,x,y,dir:'down',maxB:1,range:1,speed:3.4,state:'alive',trapT:0,deadT:0,moving:false,inv:{n:0,g:0},invT:0,ghostT:0}}
function newMatch(){S={scores:[0,0],time:0,ev:[],theme:null,layout:null};newRound()}
function newRound(){
  let theme,layout;
  do{theme=pick(Object.keys(THEMES));layout=pick(Object.keys(LAYOUTS))}while(theme===S.theme&&layout===S.layout);
  let solid=null;
  for(let t=0;t<40&&!solid;t++){const s=makeLayout(layout);if(connected(s))solid=s}
  if(!solid){layout='classic';solid=makeLayout('classic')}
  S.theme=theme;S.layout=layout;
  S.grid=[];S.hidden=[];S.vars=[];
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const i=idx(x,y);let v=0,h=0;
    if(solid[i])v=1;
    else if(!safe(x,y)&&Math.random()<.7){v=2;h=rollItem()}
    S.grid.push(v);S.hidden.push(h);S.vars.push(Math.random()<.35?1:0);
  }
  S.items=[];S.balloons=[];S.flames=[];
  S.players=[mkP(0,.5,.5),mkP(1,W-.5,H-.5)];
  S.phase='count';S.timer=3;S.result=null;S.playStart=-9;
  emit('beep');
}

// ================= 충돌 / 이동 =================
const balloonAt=(x,y)=>S.balloons.find(b=>b.x===x&&b.y===y);
function cellBlocked(cx,cy,p){
  if(cx<0||cy<0||cx>=W||cy>=H)return true;
  if(S.grid[idx(cx,cy)])return true;
  const b=balloonAt(cx,cy);return !!(b&&!b.pass.includes(p.id));
}
function hits(x,y,p){
  const x0=Math.floor(x-HB),x1=Math.floor(x+HB-1e-6),y0=Math.floor(y-HB),y1=Math.floor(y+HB-1e-6);
  for(let cy=y0;cy<=y1;cy++)for(let cx=x0;cx<=x1;cx++)if(cellBlocked(cx,cy,p))return true;
  return false;
}
function overlapCell(p,x,y){return Math.abs(p.x-(x+.5))<.5+HB&&Math.abs(p.y-(y+.5))<.5+HB}
function moveAxis(p,axis,s,dist){
  const o=axis==='x'?'y':'x',n=p[axis]+s*dist;
  const at=(a,b)=>axis==='x'?hits(a,b,p):hits(b,a,p);
  if(!at(n,p[o])){p[axis]=n;return}
  const c=s>0?Math.ceil(p[axis]+HB)-HB-1e-4:Math.floor(p[axis]-HB)+HB+1e-4;
  if((c-p[axis])*s>0&&!at(c,p[o]))p[axis]=c;
  const lane=Math.floor(p[o]),center=lane+.5,front=Math.floor(p[axis]+s*(HB+.02));
  const free=axis==='x'?!cellBlocked(front,lane,p):!cellBlocked(lane,front,p);
  if(Math.abs(p[o]-center)>.01&&free){
    const v=p[o]+Math.sign(center-p[o])*Math.min(dist,Math.abs(center-p[o]));
    if(!at(p[axis],v))p[o]=v;
  }
}
function move(p,dir,dist){const[dx,dy]=DIRS[dir];if(dx)moveAxis(p,'x',dx,dist);else moveAxis(p,'y',dy,dist)}

// ================= 물풍선 =================
function placeBalloon(p){
  const x=Math.floor(p.x),y=Math.floor(p.y);
  if(S.balloons.filter(b=>b.owner===p.id).length>=p.maxB)return;
  if(balloonAt(x,y)||S.grid[idx(x,y)])return;
  S.balloons.push({x,y,t:2.6,range:p.range,owner:p.id,pass:S.players.filter(q=>q.state!=='dead'&&overlapCell(q,x,y)).map(q=>q.id)});
  emit('place');
}
function addFlame(x,y,k){
  const f=S.flames.find(f=>f.x===x&&f.y===y);
  if(f){f.t=.5;if(f.k!==k)f.k='c'}else S.flames.push({x,y,k,t:.5});
}
let boomThisTick=false;
function explode(b){
  S.balloons.splice(S.balloons.indexOf(b),1);
  if(!boomThisTick){emit('boom');boomThisTick=true}
  addFlame(b.x,b.y,'c');
  for(const d in DIRS){
    const[dx,dy]=DIRS[d],k=dx?'h':'v';
    for(let i=1;i<=b.range;i++){
      const x=b.x+dx*i,y=b.y+dy*i;
      if(x<0||y<0||x>=W||y>=H||S.grid[idx(x,y)]===1)break;
      if(S.grid[idx(x,y)]===2){
        S.grid[idx(x,y)]=0;addFlame(x,y,k);
        const h=S.hidden[idx(x,y)];
        if(h){S.items.push({x,y,k:h,d:.5});S.hidden[idx(x,y)]=0}
        break;
      }
      const ob=balloonAt(x,y);
      if(ob){ob.t=0;addFlame(x,y,k);break}
      S.items=S.items.filter(it=>!(it.x===x&&it.y===y&&it.d<=0));
      addFlame(x,y,k);
    }
  }
}
const flameAt=(x,y)=>S.flames.some(f=>f.x===x&&f.y===y);
function kill(p){p.state='dead';p.deadT=0;p.ghostT=0;emit('pop')}

// ================= 업데이트 (방장/로컬) =================
function tickFx(dt){
  S.flames.forEach(f=>f.t-=dt);S.flames=S.flames.filter(f=>f.t>0);
  S.items.forEach(it=>{if(it.d>0)it.d-=dt});
  S.players.forEach(p=>{if(p.state==='dead')p.deadT+=dt});
}
function update(dt){
  S.time+=dt;boomThisTick=false;
  const bomb=[0,1].map(i=>{const n=inputs[i].bomb>lastBomb[i];lastBomb[i]=inputs[i].bomb;return n});
  const use=[0,1].map(i=>{const n=inputs[i].use>lastUse[i];lastUse[i]=inputs[i].use;return n});
  if(S.phase==='wait')return;
  if(S.phase==='count'){const b4=Math.ceil(S.timer);S.timer-=dt;
    if(S.timer<=0){S.phase='play';S.playStart=S.time;emit('go')}else if(Math.ceil(S.timer)!==b4)emit('beep');return}
  if(S.phase==='end'){S.timer-=dt;tickFx(dt);if(S.timer<=0)newRound();return}
  if(S.phase==='over'){S.timer-=dt;tickFx(dt);if(S.timer<=0&&(bomb[0]||bomb[1]))newMatch();return}

  S.players.forEach((p,i)=>{
    p.moving=false;
    if(p.state==='dead')return;
    if(p.invT>0)p.invT-=dt;
    if(p.ghostT>0){p.ghostT-=dt;if(p.ghostT<=0)emit('unghost')}
    if(use[i]){
      if(p.state==='trapped'&&p.inv.n>0){p.inv.n--;p.state='alive';p.trapT=0;p.invT=1.2;emit('needle')}
      else if(p.state==='alive'&&p.inv.g>0&&p.ghostT<=0){p.inv.g--;p.ghostT=6;emit('ghost')}
    }
    const d=inputs[i].dirs[inputs[i].dirs.length-1];
    if(d){p.dir=d;const ox=p.x,oy=p.y;move(p,d,(p.state==='trapped'?.7:p.speed)*dt);p.moving=p.x!==ox||p.y!==oy}
    if(p.state==='alive'&&bomb[i])placeBalloon(p);
  });
  S.balloons.forEach(b=>{b.pass=b.pass.filter(id=>overlapCell(S.players[id],b.x,b.y));b.t-=dt});
  for(let g=0;g<200;g++){const b=S.balloons.find(b=>b.t<=0);if(!b)break;explode(b)}
  tickFx(dt);

  S.players.forEach(p=>{
    if(p.state==='alive'&&p.invT<=0&&flameAt(Math.floor(p.x),Math.floor(p.y))){p.state='trapped';p.trapT=3.2;p.ghostT=0;emit('trap')}
    else if(p.state==='trapped'){p.trapT-=dt;if(p.trapT<=0)kill(p)}
  });
  const[a,b]=S.players;
  if(Math.hypot(a.x-b.x,a.y-b.y)<.8){
    if(a.state==='alive'&&b.state==='trapped')kill(b);
    else if(b.state==='alive'&&a.state==='trapped')kill(a);
  }
  S.players.forEach(p=>{
    if(p.state!=='alive')return;
    const fx=Math.floor(p.x),fy=Math.floor(p.y);
    const it=S.items.find(it=>it.d<=0&&it.x===fx&&it.y===fy);
    if(!it)return;
    if(it.k==='b')p.maxB=Math.min(8,p.maxB+1);
    if(it.k==='r')p.range=Math.min(8,p.range+1);
    if(it.k==='m')p.range=8;
    if(it.k==='s')p.speed=Math.min(6,p.speed+.5);
    if(it.k==='n')p.inv.n=Math.min(3,p.inv.n+1);
    if(it.k==='g')p.inv.g=Math.min(3,p.inv.g+1);
    S.items.splice(S.items.indexOf(it),1);emit('item');
  });
  const dead=S.players.filter(p=>p.state==='dead');
  if(dead.length){
    if(dead.length===2)S.result=-1;else{S.result=dead[0].id===0?1:0;S.scores[S.result]++}
    emit(S.result<0?'draw':'win');
    if(S.result>=0&&S.scores[S.result]>=WIN){S.phase='over';S.timer=1.5}else{S.phase='end';S.timer=2.6}
  }
}

function lg(g,x0,y0,x1,y1,st){const o=g.createLinearGradient(x0,y0,x1,y1);st.forEach(([a,c])=>o.addColorStop(a,c));return o}
function rgr(g,x0,y0,r0,x1,y1,r1,st){const o=g.createRadialGradient(x0,y0,r0,x1,y1,r1);st.forEach(([a,c])=>o.addColorStop(a,c));return o}
function rrP(g,x,y,w,h,r,fill,stroke,lw=1.5){g.beginPath();g.roundRect(x,y,w,h,r);if(fill){g.fillStyle=fill;g.fill()}if(stroke){g.lineWidth=lw;g.strokeStyle=stroke;g.stroke()}}
function cir(g,x,y,r,fill,stroke,lw=1.5){g.beginPath();g.arc(x,y,r,0,Math.PI*2);if(fill){g.fillStyle=fill;g.fill()}if(stroke){g.lineWidth=lw;g.strokeStyle=stroke;g.stroke()}}
function ell(g,x,y,rx,ry,fill,rot=0){g.beginPath();g.ellipse(x,y,Math.max(.1,rx),Math.max(.1,ry),rot,0,Math.PI*2);g.fillStyle=fill;g.fill()}
function blob(g,x,y,w,h,r,a=.3){g.save();g.filter='blur(4px)';rrP(g,x,y,w,h,r,`rgba(15,25,45,${a})`);g.restore()}

const spriteCache={};
function sprite(key,w,h,ox,oy,draw){
  let s=spriteCache[key];
  if(!s){
    const c=document.createElement('canvas');c.width=Math.ceil(w*dpr);c.height=Math.ceil(h*dpr);
    const g=c.getContext('2d');g.scale(dpr,dpr);g.translate(ox,oy);draw(g);
    s=spriteCache[key]={c,w,h,ox,oy};
  }
  return s;
}
function blit(s,x,y){ctx.drawImage(s.c,x-s.ox,y-s.oy,s.w,s.h)}

  const w=Math.sin(S.time*30+f.x+f.y)*1.5;
  const st=[[0,'#1561c4'],[.28,'#58b6ff'],[.5,'#f0fbff'],[.72,'#58b6ff'],[1,'#1561c4']];
  if(f.k==='h')rrP(ctx,px-2,cy-13+w/2,T+4,26-w,13,lg(ctx,0,cy-13,0,cy+13,st));
  else if(f.k==='v')rrP(ctx,cx-13+w/2,py-2,26-w,T+4,13,lg(ctx,cx-13,0,cx+13,0,st));
  else cir(ctx,cx,cy,22+w,rgr(ctx,cx-4,cy-4,2,cx,cy,23,[[0,'#ffffff'],[.35,'#a8ddff'],[.8,'#3d97ee'],[1,'#1561c4']]));
  for(let k=0;k<3;k++){const a=S.time*8+k*2.1+f.x;cir(ctx,cx+Math.cos(a)*12,cy+Math.sin(a*1.3)*8,2,'rgba(255,255,255,.85)')}
  ctx.globalAlpha=1;
}
function drawPlayer(i){
  const p=S.players[i],c=COL[i],g=ctx;
  const x=disp[i].x*T,y=disp[i].y*T;
  if(p.state==='dead'){
    if(p.deadT<.5){const r=20+p.deadT*60;g.globalAlpha=1-p.deadT*2;cir(g,x,y,r,null,'#fff',4);
      for(let k=0;k<8;k++){const a=k*Math.PI/4;cir(g,x+Math.cos(a)*r,y+Math.sin(a)*r,3,'#bfe6ff')}g.globalAlpha=1}
    return;
  }
  let alpha=1;
  if(p.ghostT>0){
    if(mode!=='local'&&i!==me)return; // 상대 화면에선 안 보임
    alpha=mode==='local'?.16:.42;
  }
  if(p.invT>0&&Math.sin(S.time*30)>0)alpha*=.35;
  g.globalAlpha=alpha;
  const trapped=p.state==='trapped';
  const bob=p.moving?-Math.abs(Math.sin(S.time*14))*2.5:Math.sin(S.time*3+i)*.6;
  const lift=trapped?-7+Math.sin(S.time*4)*2:0;
  const fs=p.moving?Math.sin(S.time*14)*3:0;
  const by=y-4+lift,hy=by-5+bob;
  const ex=p.dir==='left'?-3.5:p.dir==='right'?3.5:0,back=p.dir==='up';
  ell(g,x,y+18,14,5,'rgba(20,30,50,.28)');
  [[-5,fs],[5,-fs]].forEach(([o,f])=>{g.beginPath();g.ellipse(x+o,by+21+f*.6,5.2,3.6,0,0,Math.PI*2);
    g.fillStyle=lg(g,0,by+18,0,by+25,[[0,c.main],[1,c.shoe]]);g.fill();g.lineWidth=1.2;g.strokeStyle=c.line;g.stroke()});
  rrP(g,x-9,by+8+bob,18,13,6,lg(g,x-9,by+8,x+9,by+21,[[0,c.light],[.35,c.main],[1,c.dark]]),c.line,1.8);
  rrP(g,x-5,by+11+bob,10,7,4,'rgba(255,255,255,.55)');
  [[-10,fs],[10,-fs]].forEach(([o,f])=>{
    g.beginPath();g.ellipse(x+o,by+13+bob+f*.5,3.6,4.6,0,0,Math.PI*2);g.fillStyle=lg(g,0,by+9,0,by+18,[[0,c.main],[1,c.dark]]);g.fill();g.lineWidth=1.2;g.strokeStyle=c.line;g.stroke();
    ell(g,x+o,by+16.5+bob+f*.5,2.6,2.3,'#ffe1c8')});
  if(i===0){
    const wob=Math.sin(S.time*(p.moving?14:3))*.08;
    [[-7,-.22],[7,.22]].forEach(([o,r])=>{g.save();g.translate(x+o,hy-16);g.rotate(r+wob*(o<0?1:-1));
      g.beginPath();g.ellipse(0,-4,5.2,11.5,0,0,Math.PI*2);g.fillStyle=lg(g,-5,0,5,0,[[0,c.light],[.5,c.main],[1,c.dark]]);g.fill();
      g.lineWidth=1.6;g.strokeStyle=c.line;g.stroke();ell(g,0,-3,2.6,8,'#ffd0de');g.restore()});
  }else{
    [-8,8].forEach(o=>{cir(g,x+o,hy-13,6.8,rgr(g,x+o-2,hy-16,1,x+o,hy-13,7,[[0,c.light],[.5,c.main],[1,c.dark]]),c.line,1.6);
      if(!back){cir(g,x+o+ex*.4,hy-13.5,4.2,'#fff');cir(g,x+o+ex*.7,hy-13.5,2.3,'#2f3a2c');cir(g,x+o+ex*.7-.8,hy-14.4,.8,'#fff')}});
  }
  cir(g,x,hy,16.8,rgr(g,x-6,hy-8,2,x,hy,18,[[0,c.light],[.45,c.main],[1,c.dark]]),c.line,2);
  g.beginPath();g.arc(x,hy,14.5,-.9,.5);g.lineWidth=2;g.strokeStyle='rgba(255,255,255,.35)';g.stroke();
  ell(g,x-6,hy-10,4.5,2.2,'rgba(255,255,255,.7)',-.5);
  if(back){
    g.strokeStyle=c.line;g.lineWidth=1.5;g.beginPath();g.moveTo(x,hy-14);g.lineTo(x,hy+12);g.stroke();
    if(i===0)cir(g,x,hy+13,4.2,'#fff',c.line,1);
  }else{
    g.beginPath();g.ellipse(x+ex,hy+3,12,10.5,0,0,Math.PI*2);
    g.fillStyle=rgr(g,x+ex-3,hy,1,x+ex,hy+3,12,[[0,'#fff3e6'],[1,'#ffd4b4']]);g.fill();g.lineWidth=2;g.strokeStyle=c.line;g.stroke();
    g.fillStyle=c.hair;g.beginPath();
    g.moveTo(x+ex-11,hy-1);g.quadraticCurveTo(x+ex-6,hy-10,x+ex,hy-7.5);g.quadraticCurveTo(x+ex+6,hy-10,x+ex+11,hy-1);
    g.quadraticCurveTo(x+ex+4,hy-4,x+ex,hy-2);g.quadraticCurveTo(x+ex-4,hy-4,x+ex-11,hy-1);g.fill();
    const blink=Math.sin(S.time*2.3+i*2)>.97;
    [-4.5,4.5].forEach(o=>{
      const exx=x+ex*1.25+o,eyy=hy+3;
      if(trapped){g.strokeStyle='#3b2f2a';g.lineWidth=1.8;g.beginPath();g.moveTo(exx-2.5,eyy-2.5);g.lineTo(exx+2.5,eyy+2.5);g.moveTo(exx+2.5,eyy-2.5);g.lineTo(exx-2.5,eyy+2.5);g.stroke();return}
      if(blink){rrP(g,exx-3,eyy,6,1.8,1,'#3b2f2a');return}
      g.beginPath();g.ellipse(exx,eyy,2.9,3.8,0,0,Math.PI*2);g.fillStyle=lg(g,0,eyy-4,0,eyy+4,[[0,'#1d1512'],[1,'#5a3a2c']]);g.fill();
      cir(g,exx+1,eyy-1.4,1.2,'#fff');cir(g,exx-1,eyy+1.6,.6,'rgba(255,255,255,.7)');
    });
    ell(g,x+ex*1.2-8,hy+7.5,2.9,1.8,'rgba(255,110,140,.45)');ell(g,x+ex*1.2+8,hy+7.5,2.9,1.8,'rgba(255,110,140,.45)');
    g.strokeStyle='#8a4a3a';g.lineWidth=1.4;g.beginPath();
    if(trapped)g.arc(x+ex*1.2,hy+10.5,2.2,Math.PI*1.1,Math.PI*1.9);else g.arc(x+ex*1.2,hy+7.5,2.2,Math.PI*.15,Math.PI*.85);
    g.stroke();
  }
  if(trapped){
    const r=27+Math.sin(S.time*6)*1.5;
    cir(g,x,by+2,r,rgr(g,x-9,by-8,3,x,by+2,r,[[0,'rgba(255,255,255,.55)'],[.6,'rgba(170,225,255,.3)'],[1,'rgba(90,170,240,.5)']]),'rgba(255,255,255,.9)',2);
    g.beginPath();g.arc(x-8,by-8,8,Math.PI*1.1,Math.PI*1.6);g.lineWidth=3;g.stroke();
    g.beginPath();g.arc(x,by+2,r+4,-Math.PI/2,-Math.PI/2+Math.PI*2*(p.trapT/3.2));g.strokeStyle='rgba(255,90,120,.85)';g.lineWidth=3;g.stroke();
    if(p.inv.n>0&&(mode==='local'||i===me)){g.font='15px Jua';g.textAlign='center';g.fillStyle='#fff';g.strokeStyle='rgba(0,0,0,.5)';g.lineWidth=3;
      g.strokeText('바늘 사용!',x,by-34);g.fillText('바늘 사용!',x,by-34)}
  }
  if(mode!=='local'&&i===me&&!trapped){
    g.font='14px Jua';g.textAlign='center';const ty=by-42+lift;
    rrP(g,x-14,ty-11,28,18,9,'rgba(40,35,50,.75)');g.fillStyle='#fff';g.fillText('나',x,ty+3);
  }
  g.globalAlpha=1;
}
function banner(text,sub){
  const h=sub?124:100,top=H*T/2-60;
  ctx.fillStyle=lg(ctx,0,top,0,top+h,[[0,'rgba(30,30,50,.35)'],[.5,'rgba(30,30,50,.6)'],[1,'rgba(30,30,50,.35)']]);ctx.fillRect(0,top,W*T,h);
  ctx.textAlign='center';ctx.font='56px Jua';ctx.lineWidth=7;ctx.strokeStyle='rgba(20,30,60,.6)';
  ctx.strokeText(text,W*T/2,H*T/2+(sub?4:18));ctx.fillStyle='#fff';ctx.fillText(text,W*T/2,H*T/2+(sub?4:18));
  if(sub){ctx.font='21px Jua';ctx.fillStyle='#ffe9b8';ctx.fillText(sub,W*T/2,H*T/2+44)}
}
let shownTheme=null;
function render(){
  if(!groundCache[S.theme])buildGround(S.theme);
  if(!vignette)buildVignette();
  if(shownTheme!==S.theme){shownTheme=S.theme;const th=THEMES[S.theme];
    $('stage').style.borderColor=th.border;$('stage').style.boxShadow=`0 9px 0 ${th.shadow},0 18px 30px rgba(30,60,90,.18)`}
  ctx.drawImage(groundCache[S.theme],0,0,W*T,H*T);
  for(let y=0;y<H;y++){
    S.flames.forEach(f=>{if(f.y===y)drawFlame(f)});
    S.items.forEach(it=>{if(it.y===y)drawItem(it)});
    for(let x=0;x<W;x++){const v=S.grid[idx(x,y)];if(v)blit(blockSprite(S.theme,v,S.vars[idx(x,y)]),x*T,y*T)}
    S.balloons.forEach(b=>{if(b.y===y)drawBalloon(b)});
    [0,1].filter(i=>Math.min(H-1,Math.max(0,Math.floor(disp[i].y)))===y).sort((a,b)=>disp[a].y-disp[b].y).forEach(drawPlayer);
  }
  ctx.drawImage(vignette,0,0,W*T,H*T);

  const mapName=`${THEMES[S.theme].name} · ${LAYOUTS[S.layout]}`;
  if(S.phase==='count')banner(String(Math.ceil(S.timer)),mapName);
  else if(S.phase==='play'&&S.time-S.playStart<.7)banner('시작!');
  else if(S.phase==='end')banner(S.result<0?'무승부!':`${nameOf(S.result)} 승리!`);
  else if(S.phase==='over')banner(`${nameOf(S.result)} 최종 우승!`,S.timer<=0?'스페이스를 누르면 다시 시작해요':' ');

  for(const i of [0,1]){
    $('s'+i).textContent=S.scores[i];$('n'+i).textContent=nameOf(i);
    const v=S.players[i].inv,t=(v.n?`🪡${v.n}`:'')+(v.g?` 👻${v.g}`:'');
    if($('v'+i).textContent!==t)$('v'+i).textContent=t;
  }
}

// ================= 입력 =================
// 온라인: 방향키/WASD 둘 다 이동, Space 물풍선, Shift/Q 아이템
const KEY_ONLINE={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',KeyW:'up',KeyS:'down',KeyA:'left',KeyD:'right',
  Space:'bomb',ShiftLeft:'use',ShiftRight:'use',KeyQ:'use'};
// 한 키보드 테스트: P1 WASD/Space/Q, P2 방향키/Enter/오른쪽 Shift
const KEY_LOCAL={KeyW:[0,'up'],KeyS:[0,'down'],KeyA:[0,'left'],KeyD:[0,'right'],Space:[0,'bomb'],KeyQ:[0,'use'],
  ArrowUp:[1,'up'],ArrowDown:[1,'down'],ArrowLeft:[1,'left'],ArrowRight:[1,'right'],Enter:[1,'bomb'],ShiftRight:[1,'use']};
const held=new Set();
function keyTarget(code){
  if(mode==='local')return KEY_LOCAL[code]||null;
  if(me<0)return null;const a=KEY_ONLINE[code];return a?[me,a]:null;
}
function rebuildDirs(pi){
  // ↑와 W처럼 같은 방향 키 두 개 중 하나만 떼도 끊기지 않게
  const inp=inputs[pi];
  inp.dirs=inp.dirs.filter(d=>[...held].some(c=>{const t=keyTarget(c);return t&&t[0]===pi&&t[1]===d}));
}
function sendInput(){if(mode==='guest'&&conn&&conn.open)conn.send({t:'in',dirs:inputs[1].dirs,b:inputs[1].bomb,u:inputs[1].use})}
addEventListener('keydown',e=>{
  unlockAudio();
  if(e.target.tagName==='INPUT')return;
  if(e.code==='KeyM'){muted=!muted;$('btnMute').textContent=muted?'🔇':'🔊';return}
  const t=keyTarget(e.code);if(!t)return;
  e.preventDefault();
  const[pi,a]=t,inp=inputs[pi];held.add(e.code);
  if(a==='bomb'){if(!e.repeat)inp.bomb++}
  else if(a==='use'){if(!e.repeat)inp.use++}
  else{const i=inp.dirs.indexOf(a);if(i>=0)inp.dirs.splice(i,1);inp.dirs.push(a)}
  sendInput();
});
addEventListener('keyup',e=>{
  held.delete(e.code);
  const t=keyTarget(e.code);if(!t)return;
  rebuildDirs(t[0]);sendInput();
});
addEventListener('blur',()=>{held.clear();inputs.forEach(i=>i.dirs=[]);sendInput()});
addEventListener('pointerdown',unlockAudio);

// ================= 화면 패널 =================
function show(id){$('overlay').classList.remove('hide');['pMenu','pHost','pMsg'].forEach(p=>$(p).classList.toggle('hide',p!==id))}
function hideOverlay(){$('overlay').classList.add('hide')}
function msg(title,body,home){$('msgTitle').textContent=title;$('msgBody').textContent=body;$('btnHome').classList.toggle('hide',!home);show('pMsg')}
$('btnHome').onclick=()=>{location.href=location.pathname};
$('btnMute').onclick=()=>{unlockAudio();muted=!muted;$('btnMute').textContent=muted?'🔇':'🔊'};

// ================= 네트워크 =================
function rid(){return 'wb-'+Math.random().toString(36).slice(2,8)}
function startHost(){
  mode='host';me=0;show('pHost');
  peer=new Peer(rid());
  peer.on('open',id=>{$('link').value=location.origin+location.pathname+'?room='+id});
  peer.on('connection',c=>{
    if(conn&&conn.open){c.close();return}
    conn=c;
    c.on('open',()=>{hideOverlay();newMatch()});
    c.on('data',d=>{if(d&&d.t==='in'){inputs[1].dirs=d.dirs||[];inputs[1].bomb=d.b||0;inputs[1].use=d.u||0}});
    c.on('close',()=>{conn=null;msg('친구가 나갔어요','새 방을 만들어서 다시 초대해 주세요.',true)});
  });
  peer.on('error',e=>{
    if(e.type==='unavailable-id'){peer.destroy();startHost();return}
    msg('연결 오류','방을 만들지 못했어요. 새로고침 후 다시 시도해 주세요. ('+e.type+')',true);
  });
}
function startGuest(){
  mode='guest';me=1;msg('접속 중','친구 방에 들어가는 중이에요…',false);
  peer=new Peer();
  const timeout=setTimeout(()=>{if(!conn||!conn.open)msg('연결이 오래 걸려요','친구가 방 창을 열어두고 있는지 확인해 주세요. 회사·학교 와이파이에선 연결이 막힐 수 있어요.',true)},12000);
  peer.on('open',()=>{
    conn=peer.connect(ROOM,{reliable:true,serialization:'json'});
    conn.on('open',()=>{clearTimeout(timeout);hideOverlay()});
    conn.on('data',d=>{if(d&&d.t==='s')S=d.s});
    conn.on('close',()=>msg('연결이 끊겼어요','방장이 창을 닫았거나 인터넷이 끊겼어요.',true));
  });
  peer.on('error',e=>{
    clearTimeout(timeout);
    if(e.type==='peer-unavailable')msg('방을 찾을 수 없어요','친구가 창을 닫았거나 링크가 잘못됐어요. 새 링크를 받아 주세요.',true);
    else msg('연결 오류','접속하지 못했어요. ('+e.type+')',true);
  });
}
function startLocal(){
  mode='local';me=-1;
  $('help').innerHTML='P1: <kbd>WASD</kbd> 이동 · <kbd>Space</kbd> 물풍선 · <kbd>Q</kbd> 아이템 &nbsp;|&nbsp; P2: <kbd>방향키</kbd> 이동 · <kbd>Enter</kbd> 물풍선 · <kbd>오른쪽 Shift</kbd> 아이템';
  hideOverlay();newMatch();
}
$('btnHost').onclick=startHost;
$('btnLocal').onclick=startLocal;
$('btnCopy').onclick=()=>{
  const v=$('link').value;if(!v.startsWith('http'))return;
  (navigator.clipboard?navigator.clipboard.writeText(v):Promise.reject()).then(
    ()=>{$('btnCopy').textContent='복사됨!';setTimeout(()=>$('btnCopy').textContent='복사',1500)},
    ()=>{$('link').select();document.execCommand('copy')});
};

// ================= 루프 =================
newMatch();S.phase='wait';
if(ROOM)startGuest();
let last=performance.now(),sendAcc=0;
function loop(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(mode==='host'||mode==='local'){
    update(dt);
    if(mode==='host'&&conn&&conn.open){sendAcc+=dt;if(sendAcc>=1/30){sendAcc=0;const{hidden,...pub}=S;conn.send({t:'s',s:pub})}}
  }else if(mode==='guest')S.time+=dt;
  playEvents();
  S.players.forEach((p,i)=>{
    const d=disp[i];
    if(mode==='guest'&&Math.hypot(p.x-d.x,p.y-d.y)<2){const k=Math.min(1,dt*18);d.x+=(p.x-d.x)*k;d.y+=(p.y-d.y)*k}
    else{d.x=p.x;d.y=p.y}
  });
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
